<!doctype html>
<!-- A repository's social preview, 1280 x 640: scripts/render.py fills in each card's text from cards.json. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>$title</title>
<style>
@font-face{font-family:Card;font-weight:100 900;src:url($font) format("truetype")}
html,body{margin:0}
.c{width:1280px;height:640px;position:relative;overflow:hidden;font-family:Card,sans-serif;color:#ececef;
  background:radial-gradient(70% 90% at 15% 50%,#14234a 0%,transparent 70%),#0d0e11}
.c.light{color:#16181d;background:radial-gradient(70% 90% at 15% 50%,#e3ecff 0%,transparent 70%),#f7f8fa}
.wm{position:absolute;left:793px;top:120px;width:794px;opacity:.05}
.light .wm{opacity:.07}
.ic{position:absolute;left:96px;top:160px;width:320px;height:320px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.28))}
.light .ic{filter:drop-shadow(0 18px 30px rgba(0,0,0,.16))}
/* The text centred on the icon, with or without its owner: one layout for every card. */
.tx{position:absolute;left:488px;top:0;height:640px;display:flex;flex-direction:column;justify-content:center}
.own{font-size:33.4px;font-weight:700;color:#9497a0;letter-spacing:-.01em}
.nm{font-size:104px;font-weight:700;letter-spacing:-.02em;line-height:1;margin-top:3px}
.tg{font-size:32px;color:#bcbdc4;line-height:42px;margin-top:15px}
.light .tg{color:#44474d}
.mt{display:flex;gap:14px;margin-top:30px}
.mt span{font-size:20.5px;color:#94969f;padding:0 19px;height:40px;line-height:40px;border-radius:99px;border:1.5px solid #81848f}
.light .mt span{color:#6b6f78;border-color:#8d919a}
</style>
</head>
<body><div class="c $classes">
<img class="wm" src="$root/logo/overpressure-mark.svg" alt="">
<img class="ic" src="$root/$icon" alt="">
<div class="tx">$owner<div class="nm">$title</div><div class="tg">$lines</div><div class="mt">$topics</div></div>
</div></body>
</html>
