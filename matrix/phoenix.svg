    <path d="M150 150 H362 A98 98 0 0 1 460 248 V272 A98 98 0 0 1 362 370 H310 C292.7 370 288.4 326 256 326 C223.6 326 219.3 370 202 370 H150 A98 98 0 0 1 52 272 V248 A98 98 0 0 1 150 150 Z" fill="url(#blue)"/>
    <path d="M150 150 H362 A98 98 0 0 1 460 248 V272 A98 98 0 0 1 362 370 H310 C292.7 370 288.4 326 256 326 C223.6 326 219.3 370 202 370 H150 A98 98 0 0 1 52 272 V248 A98 98 0 0 1 150 150 Z" fill="url(#sheen)"/>
    <circle cx="118" cy="214" r="13" fill="#0b0d12"/>
    <circle cx="394" cy="214" r="13" fill="#0b0d12"/>
    <circle cx="118" cy="306" r="13" fill="#0b0d12"/>
    <circle cx="394" cy="306" r="13" fill="#0b0d12"/>
