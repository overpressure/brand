<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Help: a lifebuoy</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b2e35"/><stop offset="1" stop-color="#0f1013"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="130" x2="0" y2="390" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5a92ff"/><stop offset="0.5" stop-color="#2a66ec"/><stop offset="1" stop-color="#1a43b8"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  <!-- The ring, then four bands of the logo's red zone across it, on the diagonals. -->
  <circle cx="256" cy="256" r="122" fill="none" stroke="url(#blue)" stroke-width="68"/>
  <circle cx="256" cy="256" r="122" fill="none" stroke="#ff7849" stroke-width="68"
          stroke-dasharray="64 127.65" stroke-dashoffset="32" transform="rotate(45 256 256)"/>
  <circle cx="256" cy="256" r="88" fill="none" stroke="#0b0d12" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="256" cy="256" r="156" fill="none" stroke="#0b0d12" stroke-opacity="0.35" stroke-width="3"/>
</svg>
